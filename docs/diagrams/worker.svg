<text x="470" y="43" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" fill="#111111">Windows worker · IPC and crash isolation</text>
<text x="150.0" y="133.5" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">kisaDll.h</text>
<text x="150.0" y="158.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">DllOptions / KisaDllAlgorithm</text>
<text x="150.0" y="176.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">configurable workers and deadlines</text>
<text x="150.0" y="194.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">Cancel() / ResetCancel()</text>
<text x="470.0" y="133.5" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Protocol.h</text>
<text x="470.0" y="158.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">version 2 / little-endian Windows</text>
<text x="470.0" y="176.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">Request: operation + byte lengths</text>
<text x="470.0" y="194.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">Response: result / error / duration</text>
<text x="790.0" y="133.5" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">BioApi.h</text>
<text x="790.0" y="158.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">cdecl / C linkage / success 1 or 0</text>
<text x="790.0" y="176.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">KISA_Enroll() / KISA_Attempt()</text>
<text x="790.0" y="194.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">KISA_Compare()</text>
<text x="150.0" y="323.5" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">kisaDll.cpp</text>
<text x="150.0" y="348.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">State::Call() / Start() / Stop()</text>
<text x="150.0" y="366.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">owns pipe / process / job handles</text>
<text x="150.0" y="384.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">overlapped writes / read polling</text>
<text x="150.0" y="402.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">deadline or Stop terminates worker</text>
<text x="470.0" y="323.5" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">worker.cpp</text>
<text x="470.0" y="348.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">LoadLibraryExW() / GetProcAddress()</text>
<text x="470.0" y="366.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">Read() → Invoke() → Write()</text>
<text x="470.0" y="384.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">SEH / output guards / ABI checks</text>
<text x="470.0" y="402.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">dedicated IPC; DLL stdout isolated</text>
<text x="790.0" y="323.5" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Selected algorithm DLL</text>
<text x="790.0" y="348.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">KISA_Enroll(iType, gray8, ...)</text>
<text x="790.0" y="366.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">KISA_Attempt(iType, gray8, ...)</text>
<text x="790.0" y="384.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">KISA_Compare(enroll, attempt, ...)</text>
<text x="790.0" y="402.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">templates remain opaque to host</text>
<text x="150.0" y="573.5" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Failure categories</text>
<text x="150.0" y="598.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">FAIL · DLL error code / message</text>
<text x="150.0" y="616.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">TIMEOUT · CRASH · MISMATCH</text>
<text x="150.0" y="634.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">CANCELLED · stopped run discarded</text>
<text x="470.0" y="573.5" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Worker lifecycle</text>
<text x="470.0" y="598.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">job kills worker on handle close</text>
<text x="470.0" y="616.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">fault → fresh process on next call</text>
<text x="470.0" y="634.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">first call allows ≥120 seconds</text>
<text x="790.0" y="573.5" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Buffer contract</text>
<text x="790.0" y="598.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">template length &gt;0 and &lt;1,000,000</text>
<text x="790.0" y="616.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">error message: 256 bytes</text>
<text x="790.0" y="634.5" font-family="Arial" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">save and replay actual byte lengths</text>
<text x="310" y="332" font-family="Arial" font-size="12" font-weight="400" text-anchor="middle" fill="#52606d">request</text>
<text x="310" y="388" font-family="Arial" font-size="12" font-weight="400" text-anchor="middle" fill="#52606d">reply</text>
<text x="630" y="332" font-family="Arial" font-size="12" font-weight="400" text-anchor="middle" fill="#52606d">cdecl</text>
<text x="630" y="388" font-family="Arial" font-size="12" font-weight="400" text-anchor="middle" fill="#52606d">outputs</text>
<text x="183" y="500" font-family="Arial" font-size="12" font-weight="400" text-anchor="middle" fill="#52606d">record</text>
<text x="525" y="500" font-family="Arial" font-size="12" font-weight="400" text-anchor="middle" fill="#52606d">fault / next call</text>
<text x="470" y="710" font-family="Arial" font-size="12" font-weight="400" text-anchor="middle" fill="#52606d">Solid: calls / data flow     Dashed: selected direct #include links</text>
</svg>
