<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="230.6489mm" viewBox="0 0 940 730" role="img"><title>Windows worker · IPC and crash isolation</title><desc>Current project implementation; editable vector source. Generated from verified source paths and selected direct includes.</desc><rect width="940" height="730" fill="white"/>
